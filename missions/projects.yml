# Projets : dépôt, tracker, correspondance du vocabulaire
#
# Le workspace a un vocabulaire canonique, fixé par le workflow : les états
# `to-refine`, `ready`, `in-progress`, `in-review`, `done` et les types `bug`,
# `story`. Les états se projettent sur un libellé GitHub ou un statut Jira ; les
# types se projettent sur le type natif de l'issue (`Bug`, `Feature`) ou le type
# Jira (`Bug`, `Story`). C'est ce vocabulaire qu'emploient les documents, les branches et les
# commits. Chaque projet le projette sur son tracker par le bloc `map`.
#
# Règles de la projection :
#   - la clé est le nom canonique, la valeur est le nom exact dans le tracker ;
#   - une valeur `null` signifie « pas de représentation » : l'état se traduit
#     par autre chose que le vocabulaire (fermeture de l'issue, par exemple) ;
#   - quand le workflow du tracker a moins d'états que le canonique, on garde le
#     statut le plus proche et on ajoute un libellé pour la nuance ;
#   - quand il en a plus, la valeur peut être une liste : plusieurs statuts du
#     tracker disent le même état canonique. Un statut ne peut appartenir qu'à un
#     seul état, et un statut absent de la table reste « inconnu » — jamais
#     rabattu sur un voisin.
#
# Champs d'un projet :
#   id       identifiant court du workspace (minuscules)
#   name     nom lisible
#   repo     chemin du clone sur le poste
#   tracker  jira | github
#   jira     site, cloud_id (facultatif, résolu depuis le site sinon), préfixe
#            des clés, adresse du compte et champ des story points (tracker:
#            jira) ; l'API passe par la passerelle api.atlassian.com, seule à
#            accepter les jetons « scoped » ;
#            le jeton vient du Trousseau (service « atlassian-token ») ou de
#            JIRA_API_TOKEN, jamais de ce fichier
#   github   owner et repo du dépôt distant (tracker: github)
#   map      correspondance canonique -> tracker (obligatoire)
#
# Trois projets sont déclarés. Les `map` de `manager` et `connect` ont été
# relevés sur le site (voir le commentaire au-dessus de chaque entrée) : ils ne
# sont pas devinés.

# Chaque projet est une source lue indépendamment : son échec n'empêche pas
# la lecture des autres, et rien n'est supposé partagé entre deux projets.

canonical:
  states: [to-refine, ready, in-progress, in-review, ready-for-prod, done]
  types: [bug, story]
  priorities: [urgent, high, normal, low]

# Produits déduits des labels Jira. La première étiquette connue gagne ;
# les labels de thème (services-residents), de partenaire (visor, welcomr)
# ou d'outil (Claude) ne sont pas des produits. Un ticket sans label garde
# le nom de sa source.
products:
  manager: Manager
  marketplace: Marketplace
  core: Core
  connect: Connect
  clienthub: Clienthub

projects:
  - id: missions
    name: Workspace missions
    repo: ~/projects/missions
    tracker: github
    github:
      owner: daedalforge
      repo: missions
    map:
      states:
        to-refine: to-refine
        ready: ready
        in-progress: in-progress
        in-review: in-review
        ready-for-prod: ready-for-prod
        done: null
      types:
        bug: Bug
        story: Feature
      priorities:
        urgent: priority:urgent
        high: priority:high
        normal: priority:normal
        low: priority:low
      points: "sp:"

  # Relevé le 2026-11-11 sur https://saas-office.atlassian.net :
  # `GET /rest/api/3/project/SO/statuses` donne, pour tous les types, treize
  # statuts — d'où les listes. Le déploiement y tient en trois temps, après le
  # développement : `Local Testing`, `Staging Test`, `Ready for prod` ; tous
  # trois sont `ready-for-prod` (pas `in-progress`, pas `done`), seul `Released`
  # ferme la mission. `Rejected` n'a pas d'équivalent canonique et reste
  # inconnu, plutôt que d'être confondu avec `done`.
  - id: manager
    name: Manager
    repo: ~/projects/Manager
    tracker: jira
    jira:
      site: https://saas-office.atlassian.net
      cloud_id: 1e424f0c-65f2-4aab-aa05-ba0d359fa1f0
      key_prefix: SO
      email: stephane.lucien-vauthier@saas-office.com
      story_points_field: customfield_10032
    map:
      states:
        to-refine: [To Refine, Inbox, To Qualify, Analysis done]
        ready: [Ready to Dev, To Dev]
        in-progress: [In Progress]
        in-review: [Code review]
        ready-for-prod: [Local Testing, Staging Test, Ready for prod]
        done: [Released]
      types:
        bug: Bug
        story: Story
      priorities:
        urgent: Highest
        high: High
        normal: Medium
        low: Low

  # Relevé le 2026-11-11 sur le site : SOC (Connect) a sept statuts — To Refine,
  # Inbox, Ready for dev, In Progress, Ready for prod, Code review, Done.
  # « Ready for prod » est en catégorie In Progress, mais c'est le seul statut
  # entre la revue et la fin : il est `ready-for-prod`, pas `in-progress` ;
  # `Done` seul ferme la mission.
  - id: connect
    name: Connect
    repo: ~/projects/Connect
    tracker: jira
    jira:
      site: https://saas-office.atlassian.net
      cloud_id: 1e424f0c-65f2-4aab-aa05-ba0d359fa1f0
      key_prefix: SOC
      email: stephane.lucien-vauthier@saas-office.com
      story_points_field: customfield_10032
    map:
      states:
        to-refine: [To Refine, Inbox]
        ready: Ready for dev
        in-progress: [In Progress]
        in-review: Code review
        ready-for-prod: Ready for prod
        done: Done
      types:
        bug: Bug
        story: Story
      priorities:
        urgent: Highest
        high: High
        normal: Medium
        low: Low
