# Projets : dépôt, tracker, correspondance du vocabulaire
#
# Le workspace a un vocabulaire canonique, fixé par le workflow : les états
# `to-refine`, `ready`, `in-progress`, `in-review`, `done` et les types `bug`,
# `story`. Les états se projettent sur un libellé GitHub ou un statut Jira ; les
# types se projettent sur le type natif de l'issue (`Bug`, `Feature`) ou le type
# Jira (`Bug`, `Story`). C'est ce vocabulaire qu'emploient les documents, les branches et les
# commits. Chaque projet le projette sur son tracker par le bloc `map`.
#
# Règles de la projection :
#   - la clé est le nom canonique, la valeur est le nom exact dans le tracker ;
#   - une valeur `null` signifie « pas de représentation » : l'état se traduit
#     par autre chose que le vocabulaire (fermeture de l'issue, par exemple) ;
#   - quand le workflow du tracker a moins d'états que le canonique, on garde le
#     statut le plus proche et on ajoute un libellé pour la nuance.
#
# Champs d'un projet :
#   id       identifiant court du workspace (minuscules)
#   name     nom lisible
#   repo     chemin du clone sur le poste
#   tracker  jira | github
#   jira     site, préfixe des clés, adresse du compte et champ des story
#            points (tracker: jira) ;
#            le jeton vient du Trousseau (service « atlassian-token ») ou de
#            JIRA_API_TOKEN, jamais de ce fichier
#   github   owner et repo du dépôt distant (tracker: github)
#   map      correspondance canonique -> tracker (obligatoire)
#
# Seul le projet `missions` est déclaré. Un projet Jira s'ajoutera avec le même
# format (voir les champs ci-dessus), quand son dépôt sera branché : d'ici là,
# aucune correspondance n'est inventée.

# Chaque projet est une source lue indépendamment : son échec n'empêche pas
# la lecture des autres, et rien n'est supposé partagé entre deux projets.

canonical:
  states: [to-refine, ready, in-progress, in-review, done]
  types: [bug, story]
  priorities: [urgent, high, normal, low]

projects:
  - id: missions
    name: Workspace missions
    repo: ~/projects/missions
    tracker: github
    github:
      owner: daedalforge
      repo: missions
    map:
      states:
        to-refine: to-refine
        ready: ready
        in-progress: in-progress
        in-review: in-review
        done: null
      types:
        bug: Bug
        story: Feature
      priorities:
        urgent: priority:urgent
        high: priority:high
        normal: priority:normal
        low: priority:low
      points: "sp:"
