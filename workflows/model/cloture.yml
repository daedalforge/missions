  - from: merger
    to: fermer-ticket
  - from: fermer-ticket
    to: supprimer-branche
  - from: supprimer-branche
    to: fermer-epic
  - from: fermer-epic
    to: clore-journal
  - from: clore-journal
    to: solder-checklist
