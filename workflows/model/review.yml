workflow: review
title: Revue
document: workflows/review.md
entry: in-review
exit:
  - ready-for-prod
  - in-progress
  - to-refine
nodes:
  - id: constater-validation
    label: Constater la validation des collègues sur chaque PR
    section: Ce qu'on constate
    writer: session
    artifact: la validation de chaque PR citée, verdict et date
    gate: le verdict des collègues est prouvé sur chaque PR, et une mission découpée nomme celle qui manque
  - id: decouper
    label: Découper une PR trop grosse
    section: Quand la PR est trop grosse
    writer: session
    artifact: la liste branches écrite par la route, les PR empilées ouvertes
    gate: le demandeur a confirmé le découpage
  - id: constater-criteres
    label: Constater que chaque critère a son scénario
    section: Ce qu'on constate
    writer: session
    artifact: la liste des critères, chacun avec le scénario qui le couvre
    gate: chaque critère d'acceptation cite le scénario qui le couvre
  - id: verifier-perimetre
    label: Vérifier le périmètre
    section: Ce qu'on constate
    writer: session
    artifact: le périmètre vérifié, fichier par fichier
    gate: la PR ne sort pas du périmètre du cadrage
  - id: verifier-tests
    label: Vérifier les tests
    section: Ce qu'on constate
    writer: session
    artifact: la suite verte, chaque scénario couvert ; aucun compte de tests
    gate: les tests passent sur la tête de branche
  - id: verifier-journal
    label: Vérifier le journal
    section: Ce qu'on constate
    writer: session
    artifact: le journal relu, étape par étape
    gate: le journal porte chaque étape avec sa preuve
  - id: verifier-checklist
    label: Vérifier la checklist
    section: Ce qu'on constate
    writer: session
    artifact: la checklist relue, case par case
    gate: chaque case cochée annonce une preuve retrouvée
  - id: ecarter-motifs
    label: Écarter ce qui n'est pas un motif de refus
    section: Ce qui n'est pas un motif de refus
    writer: session
    artifact: la liste des remarques écartées, avec leur motif
    gate: aucun refus ne porte sur le style ou le goût
  - id: decider
    label: Trancher
    section: Décisions possibles
    writer: session
  - id: reprendre
    label: Demander des changements
    section: Décisions possibles
    writer: demandeur
    artifact: le libellé in-progress
  - id: renvoyer-cadrage
    label: Renvoyer au cadrage
    section: Décisions possibles
    writer: demandeur
    artifact: le libellé to-refine
  - id: enregistrer-validation
    label: Enregistrer la décision datée dans le ticket
    section: Sur le tracker
    writer: session
    artifact: le commentaire daté, avec les preuves
    gate: le commentaire est daté et cite le scénario et la preuve de chaque critère
  - id: verifier-sortie
    label: Vérifier la condition de sortie
    section: Condition de sortie
    writer: session
    artifact: la condition de sortie cochée, case par case
    gate: les cinq cases de sortie sont cochées
  - id: passer-prete-a-partir
    label: Passer le ticket à prête à partir
    section: Sur le tracker
    writer: session
    artifact: le libellé ready-for-prod
    gate: le ticket porte ready-for-prod et plus in-review, et chaque PR de la mission est validée
edges:
  - from: in-review
    to: constater-validation
  - from: in-review
    to: decouper
    when: la PR est trop grosse
  - from: decouper
    to: constater-validation
    when: la pile est ouverte
  - from: constater-validation
    to: constater-criteres
  - from: constater-criteres
    to: verifier-perimetre
  - from: verifier-perimetre
    to: renvoyer-cadrage
    when: la PR sort du périmètre
  - from: verifier-perimetre
    to: verifier-tests
  - from: verifier-tests
    to: verifier-journal
  - from: verifier-journal
    to: verifier-checklist
  - from: verifier-checklist
    to: ecarter-motifs
  - from: ecarter-motifs
    to: decider
  - from: decider
    to: enregistrer-validation
    when: tout est conforme
  - from: decider
    to: reprendre
    when: une preuve manque
  - from: decider
    to: renvoyer-cadrage
    when: un critère n'a pas de scénario
  - from: enregistrer-validation
    to: verifier-sortie
  - from: verifier-sortie
    to: passer-prete-a-partir
    when: les cinq cases sont cochées
  - from: passer-prete-a-partir
    to: ready-for-prod
  - from: reprendre
    to: in-progress
  - from: renvoyer-cadrage
    to: to-refine
