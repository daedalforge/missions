# Fixture : une board GitHub à champs d'organisation, une board restée aux labels.
canonical:
  states: [to-refine, ready, in-progress, in-review, ready-for-prod, done]
  types: [bug, story]
  priorities: [urgent, high, normal, low]

trackers:
  - id: cfg
    name: Config
    reference: CFG
    tracker: github
    github: { owner: example, repo: config }
    fields: { state: Workflow stage, priority: Priority, points: Story point }
    map:
      states:
        to-refine: To refine
        ready: Ready
        in-progress: In progress
        in-review: In review
        ready-for-prod: Ready for prod
        done: null
      types:
        bug: Bug
        story: Feature
      priorities:
        urgent: Urgent
        high: High
        normal: Medium
        low: Low

  - id: lab
    name: Labels board
    reference: LAB
    tracker: github
    github: { owner: example, repo: labels }
    map:
      states:
        to-refine: to-refine
        ready: ready
        in-progress: in-progress
        in-review: in-review
        ready-for-prod: ready-for-prod
        done: null
      types:
        bug: Bug
        story: Feature
      priorities:
        urgent: priority:urgent
        high: priority:high
        normal: priority:normal
        low: priority:low
      points: "sp:"

projects:
  - id: config
    name: Config
    repo: ~/projects/config

  - id: labels
    name: Labels
    repo: ~/projects/labels
